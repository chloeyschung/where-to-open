# 월간 데이터 갱신: 공공데이터를 다시 받아 네 축을 계산하고, 검증을 통과하면 DB를 한 번에 교체한다.
# 자세한 설명: batch/README.md
#
# 필요한 저장소 Secrets: SEOUL_API_KEY, DATABASE_URL (Render 환경변수와 같은 값)
# 잠시 멈추려면 저장소 Variables 에 BATCH_DISABLED = true

name: 월간 데이터 갱신

on:
  schedule:
    # 매월 1~7일 00:00 UTC = 09:00 KST. 이번 기준일이 이미 성공했으면 batch/run.py 가 바로 끝내므로,
    # 1일에 실패하면 7일까지 하루 한 번 다시 시도하는 셈. backend/app/services/freshness.py 의 RETRY_DAYS 와 같아야 한다
    - cron: "0 0 1-7 * *"
  workflow_dispatch:
    inputs:
      base_date:
        description: "기준일 YYYY-MM-DD (비우면 지난달 말일)"
        required: false
        default: ""
      load:
        description: "DB까지 교체 (끄면 계산·검증만)"
        type: boolean
        default: true

concurrency:
  group: monthly-refresh   # 같은 배치가 겹쳐 돌지 않게 (DB 쪽은 advisory lock 으로 한 번 더 막는다)
  cancel-in-progress: false

permissions:
  contents: write   # 데이터 분석 페이지 숫자(data.js)를 커밋하려고

jobs:
  refresh:
    if: vars.BATCH_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r backend/requirements.txt -r competition/requirements.txt -r demand/requirements.txt

      - name: 배치 실행
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          BASE_DATE: ${{ inputs.base_date }}
          LOAD: ${{ github.event_name == 'schedule' || inputs.load }}
        run: |
          args=(--trigger "$TRIGGER")
          if [ -n "$BASE_DATE" ]; then args+=(--base-date "$BASE_DATE"); fi
          if [ "$LOAD" != "true" ]; then args+=(--no-load); fi
          python batch/run.py "${args[@]}"

      - name: 데이터 분석 페이지 숫자 커밋
        if: success() && (github.event_name == 'schedule' || inputs.load)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-html/analysis/data.js
          if git diff --cached --quiet; then
            echo "바뀐 숫자 없음"
          else
            git commit -m "데이터 분석 페이지: 월 배치 기준일 갱신"
            git pull --rebase   # 배치가 도는 사이 main 에 다른 커밋이 들어왔어도 푸시되게
            git push
          fi
